# Conversational-Intelligence word directory. Plain phrases, no regex needed.
#
# How phrases are matched (case-insensitive):
#   - whole words only; "budget" does not match "budgeting" unless you write budget*
#   - a trailing * means "any word ending":  budget*  ->  budget, budgets, budgeting
#   - apostrophes are optional:  "don't"  also matches  "dont"  and  "don’t"
#   - spaces match any run of whitespace
# Positive phrases are ignored when negated within 3 words ("not looking to improve").
# Disqualifier phrases are NOT negation-checked (they already say "no/not").
#
# Add your own words anywhere. Run:  python -m bant_agent lexicon   to check for conflicts.
# Only CUSTOMER turns are scored. "cue" phrases are what a SELLER says that leads the customer.

